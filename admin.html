<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Return Community</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-base: #070709;
            --bg-card: rgba(22, 22, 28, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 0%, #1f1215 0%, transparent 50%), radial-gradient(circle at 100% 100%, #030712 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card, #adminContent {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 900px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .login-card { max-width: 420px; text-align: center; }
        h1, h2 { color: #f87171; margin-bottom: 1rem; }
        .form-input { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-subtle); padding: 0.75rem 1rem; border-radius: 10px; color: white; margin-bottom: 1rem; }
        .btn-dash { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-subtle); color: white; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-login { background: #ef4444; width: 100%; padding: 0.75rem; border-radius: 10px; border: none; color: white; font-weight: 700; cursor: pointer; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem; margin-bottom: 2rem; }
        .dash-card { background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 1.5rem; }
        
        .table-mock { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .table-mock th, .table-mock td { padding: 0.75rem; border-bottom: 1px solid var(--border-subtle); text-align: left; }

        .footer-credit { position: fixed; bottom: 20px; right: 20px; font-size: 0.75rem; color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-card">
        <h2>Return Community</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Accès Panel Administration</p>
        <input type="password" id="adminPassword" class="form-input" placeholder="Code secret...">
        <button class="btn-login" onclick="checkAdminPassword()">S'authentifier</button>
        <br><br>
        <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem;">← Retour au site</a>
    </div>

    <div id="adminContent" style="display: none;">
        <div class="admin-header">
            <h1>Panel Administrateur - Return Community</h1>
            <button class="btn-dash" onclick="window.location.href='index.html'">Déconnexion</button>
        </div>

        <div class="dash-card">
            <h3>Gestion des Membres Connectés</h3>
            <table class="table-mock">
                <thead><tr><th>Utilisateur</th><th>ID Steam</th></tr></thead>
                <tbody id="membersBody"></tbody>
            </table>
        </div>
    </div>

    <div class="footer-credit">Site product by Aykoh</div>

    <script>
        const ADMIN_SECRET_CODE = "1g.#Yo8qP_1"; 

        function checkAdminPassword() {
            if (document.getElementById('adminPassword').value === ADMIN_SECRET_CODE) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadAdminData();
            } else {
                alert("Code incorrect.");
            }
        }

        function loadAdminData() {
            // Récupère l'utilisateur connecté via Steam (stocké par index.html)
            const user = JSON.parse(localStorage.getItem('return_user_session'));
            const steamId = localStorage.getItem('return_steam_id');
            
            if (user) {
                document.getElementById('membersBody').innerHTML = `<tr><td>${user.name}</td><td>${steamId}</td></tr>`;
            } else {
                document.getElementById('membersBody').innerHTML = `<tr><td colspan="2" style="text-align:center;">Aucun membre connecté via Steam</td></tr>`;
            }
        }
    </script>
</body>
</html>
